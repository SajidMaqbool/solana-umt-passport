<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Passport | Baghi Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: white;
            overflow-x: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 10%, rgba(153, 69, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(20, 241, 149, 0.15) 0%, transparent 40%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .neon-glow {
            box-shadow: 0 0 30px rgba(20, 241, 149, 0.2);
            border: 1px solid rgba(20, 241, 149, 0.5);
        }

        .gradient-text {
            background: linear-gradient(90deg, #14F195, #9945FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-container {
            background: white;
            padding: 8px;
            border-radius: 18px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .passport-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
            border-left: 5px solid #14F195;
            transition: transform 0.4s ease;
        }
        
        .passport-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <nav class="container mx-auto px-6 py-8 flex justify-between items-center animate__animated animate__fadeInDown">
        <div class="flex items-center gap-5">
            <div class="logo-container">
                <img src="https://www.umt.edu.pk/images/UMT-Logo.png" alt="UMT Logo" class="h-12 w-auto">
            </div>
            <div class="h-10 w-[1px] bg-white/20"></div>
            <div>
                <span class="font-black text-3xl tracking-tighter uppercase">Sol<span class="text-[#14F195]">Passport</span></span>
                <p class="text-[9px] text-green-400 font-bold tracking-[0.3em] uppercase">Verified Identity Protocol</p>
            </div>
        </div>
        
        <button id="connectBtn" class="glass px-8 py-3.5 rounded-2xl text-sm font-bold border border-white/20 hover:bg-white/10 transition flex items-center gap-3">
            <i class="fa-solid fa-wallet text-[#14F195]"></i> 
            <span>Connect Wallet</span>
        </button>
    </nav>

    <main class="container mx-auto px-6 py-12">
        
        <div class="max-w-4xl mx-auto text-center mb-16 animate__animated animate__zoomIn">
            <h1 class="text-6xl md:text-8xl font-black mb-6 leading-none">
                Baghi <span class="gradient-text">Passport</span>
            </h1>
            <p class="text-gray-400 text-xl font-medium">Decentralized Student Verification on Solana Blockchain.</p>
        </div>

        <div class="grid lg:grid-cols-2 gap-12 max-w-6xl mx-auto">
            
            <div class="glass p-10 space-y-8 animate__animated animate__fadeInLeft">
                <h3 class="text-2xl font-bold border-b border-white/10 pb-4">Verify Identity</h3>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-2 block">Student Full Name</label>
                        <input type="text" id="nameIn" placeholder="Write your name here..." 
                            class="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 focus:border-[#14F195] outline-none text-white font-bold transition-all">
                    </div>

                    <div class="bg-white/5 p-5 rounded-2xl border border-white/10 flex items-center gap-4">
                        <input type="checkbox" id="humanCheck" class="w-6 h-6 accent-[#14F195] cursor-pointer">
                        <label for="humanCheck" class="text-sm font-bold text-gray-300 cursor-pointer select-none">I am not a bot. Verify my claim.</label>
                    </div>

                    <button id="mintBtn" disabled 
                        class="w-full bg-gray-700 text-gray-500 py-5 rounded-2xl font-black uppercase text-sm tracking-widest cursor-not-allowed transition-all">
                        Mint Identity
                    </button>
                </div>
            </div>

            <div class="space-y-6 animate__animated animate__fadeInRight">
                <div id="cardUI" class="glass passport-card p-10 relative overflow-hidden h-[280px] flex flex-col justify-between group">
                    <div class="flex justify-between items-start">
                        <div class="bg-[#14F195]/10 border border-[#14F195]/30 px-5 py-2 rounded-xl text-[10px] font-black text-[#14F195] tracking-widest">
                            UMT STUDENT IDENTITY
                        </div>
                        <img src="https://www.umt.edu.pk/images/UMT-Logo.png" alt="Logo" class="h-8 brightness-200 opacity-60">
                    </div>

                    <div>
                        <p class="text-[10px] text-gray-500 font-black uppercase tracking-[0.4em] mb-1">Holder Name</p>
                        <h2 id="prevName" class="text-4xl font-black tracking-tighter text-white uppercase truncate">---</h2>
                    </div>

                    <div class="flex justify-between items-end border-t border-white/10 pt-6">
                        <div>
                            <p class="text-[9px] text-gray-500 font-black uppercase tracking-widest">Status</p>
                            <p id="statusTxt" class="font-bold text-sm text-yellow-500">PENDING_VERIFICATION</p>
                        </div>
                        <div class="text-right">
                            <p class="text-white text-[10px] font-black uppercase tracking-widest">Network</p>
                            <p class="text-gray-500 text-[10px] font-bold">SOLANA DEVNET</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <a href="https://github.com/SajidMaqbool/solana-umt-passport" target="_blank" class="glass p-6 flex flex-col items-center justify-center gap-2 hover:bg-white/5 transition">
                        <i class="fa-brands fa-github text-3xl"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">Source Code</span>
                    </a>
                    <a href="https://solscan.io/account/CLEhaRz7CnTWEQNaAonRktJDyVP3YsCMQ8GEPnc2BZ5k?cluster=devnet" target="_blank" class="glass p-6 flex flex-col items-center justify-center gap-2 hover:bg-[#14F195]/10 transition border border-[#14F195]/20">
                        <i class="fa-solid fa-magnifying-glass-chart text-[#14F195] text-3xl"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest text-[#14F195]">SolScan</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-20 border-t border-white/5 mt-10 opacity-60">
        <p class="text-[10px] font-black uppercase tracking-[0.5em]">Developed by Baghi | UMT Lahore</p>
    </footer>

    <script>
        const nameIn = document.getElementById('nameIn');
        const humanCheck = document.getElementById('humanCheck');
        const mintBtn = document.getElementById('mintBtn');
        const connectBtn = document.getElementById('connectBtn');
        const prevName = document.getElementById('prevName');
        const statusTxt = document.getElementById('statusTxt');
        
        let walletAddress = null;

        // Real-time Update
        nameIn.addEventListener('input', (e) => {
            prevName.innerText = e.target.value || "---";
            validate();
        });

        humanCheck.addEventListener('change', validate);

        // Wallet Connection
        connectBtn.onclick = async () => {
            if (window.solana) {
                try {
                    const resp = await window.solana.connect();
                    walletAddress = resp.publicKey.toString();
                    connectBtn.innerHTML = `<i class="fa-solid fa-circle-check text-[#14F195]"></i> ${walletAddress.slice(0,4)}...${walletAddress.slice(-4)}`;
                    connectBtn.classList.add('neon-glow');
                    validate();
                } catch (err) { console.log(err); }
            } else {
                alert("Phantom Wallet not found! Please install it.");
            }
        };

        function validate() {
            if (walletAddress && nameIn.value.trim() !== "" && humanCheck.checked) {
                mintBtn.disabled = false;
                mintBtn.classList.remove('bg-gray-700', 'text-gray-500', 'cursor-not-allowed');
                mintBtn.classList.add('bg-[#14F195]', 'text-black', 'cursor-pointer', 'shadow-[0_0_20px_rgba(20,241,149,0.3)]');
                mintBtn.innerText = "Confirm & Mint Identity";
            } else {
                mintBtn.disabled = true;
                mintBtn.classList.add('bg-gray-700', 'text-gray-500', 'cursor-not-allowed');
                mintBtn.classList.remove('bg-[#14F195]', 'text-black', 'shadow-[0_0_20px_rgba(20,241,149,0.3)]');
                mintBtn.innerText = "Mint Identity";
            }
        }

        // Mint Button Action
        mintBtn.onclick = () => {
            mintBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Minting on Chain...`;
            mintBtn.disabled = true;

            setTimeout(() => {
                alert(`🎉 SUCCESS!\n\nName: ${nameIn.value}\nVerified on Solana Devnet.`);
                statusTxt.innerText = "VERIFIED_ON_CHAIN";
                statusTxt.classList.replace('text-yellow-500', 'text-green-400');
                mintBtn.innerHTML = "Identity Verified ✅";
                mintBtn.style.background = "#9945FF";
                mintBtn.style.color = "white";
            }, 2500);
        };
    </script>
</body>
</html>
