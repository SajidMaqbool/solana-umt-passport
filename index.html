<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Passport | Proof-of-Personhood</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: white;
            overflow-x: hidden;
        }

        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 10% 10%, rgba(153, 69, 255, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 241, 149, 0.12) 0%, transparent 40%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .logo-container {
            background: white; padding: 8px; border-radius: 18px; width: 65px; height: 65px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 25px rgba(255,255,255,0.2);
        }

        .gradient-text {
            background: linear-gradient(90deg, #14F195, #9945FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mono-font { font-family: 'JetBrains Mono', monospace; }

        .tag {
            background: rgba(20, 241, 149, 0.1);
            border: 1px solid rgba(20, 241, 149, 0.3);
            color: #14F195;
            padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <nav class="container mx-auto px-6 py-8 flex justify-between items-center animate__animated animate__fadeInDown">
        <div class="flex items-center gap-5">
            <div class="logo-container">
                <img src="https://www.umt.edu.pk/images/UMT-Logo.png" alt="UMT Logo" class="h-12 w-auto">
            </div>
            <div class="h-10 w-[1px] bg-white/20"></div>
            <div>
                <span class="font-black text-2xl tracking-tighter uppercase leading-none">Sol<span class="text-[#14F195]">Passport</span></span>
                <p class="text-[9px] text-gray-500 font-bold tracking-[0.2em] uppercase mt-1">Proof-of-Personhood Protocol</p>
            </div>
        </div>
        
        <button id="connectBtn" class="glass px-8 py-3.5 rounded-2xl text-sm font-bold border border-white/20 hover:bg-white/10 transition flex items-center gap-3">
            <i class="fa-solid fa-wallet text-[#14F195]"></i> 
            <span>Connect Wallet</span>
        </button>
    </nav>

    <main class="container mx-auto px-6 py-12">
        <div class="max-w-5xl mx-auto text-center mb-16 animate__animated animate__zoomIn">
            <div class="flex justify-center mb-6">
                <span class="tag"># IDENTITY & PRIVACY</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-black mb-6 leading-tight mono-font uppercase">
                "SOLANA PASSPORT" <br>
                <span class="gradient-text text-3xl md:text-5xl tracking-tight">A Proof-of-Personhood Protocol on Solana</span>
            </h1>
        </div>

        <div class="grid lg:grid-cols-2 gap-12 max-w-6xl mx-auto">
            
            <div class="glass p-10 space-y-8">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-fingerprint text-[#14F195] text-2xl"></i>
                    <h3 class="text-xl font-bold tracking-tight uppercase">Identity Enrollment</h3>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-2 block">Legal Name</label>
                        <input type="text" id="nameIn" placeholder="Full name..." 
                            class="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 focus:border-[#14F195] outline-none text-white font-bold transition-all">
                    </div>

                    <div class="bg-white/5 p-5 rounded-2xl border border-white/10 flex items-center gap-4">
                        <input type="checkbox" id="humanCheck" class="w-6 h-6 accent-[#14F195] cursor-pointer">
                        <label for="humanCheck" class="text-sm font-bold text-gray-300 cursor-pointer">Verify Human Existence (PoP)</label>
                    </div>

                    <button id="mintBtn" disabled 
                        class="w-full bg-gray-800 text-gray-500 py-5 rounded-2xl font-black uppercase text-xs tracking-widest cursor-not-allowed transition-all">
                        Mint Verified Passport
                    </button>
                </div>
            </div>

            <div class="space-y-6">
                <div class="glass p-10 relative overflow-hidden h-[280px] flex flex-col justify-between border-l-4 border-[#14F195]">
                    <div class="flex justify-between items-start">
                        <span class="tag">Protocol Active</span>
                        <img src="https://www.umt.edu.pk/images/UMT-Logo.png" class="h-8 brightness-200 opacity-50">
                    </div>

                    <div>
                        <p class="text-[10px] text-gray-500 font-black uppercase tracking-[0.4em] mb-1">Human Identity</p>
                        <h2 id="prevName" class="text-4xl font-black tracking-tighter text-white uppercase truncate">---</h2>
                    </div>

                    <div class="flex justify-between items-end border-t border-white/10 pt-6">
                        <div>
                            <p class="text-[9px] text-gray-500 font-black mb-1">Verification Status</p>
                            <p id="statusTxt" class="font-bold text-xs text-yellow-500 mono-font">AWAITING_PROOF</p>
                        </div>
                        <div class="text-right">
                            <p class="text-gray-500 text-[10px] font-bold">SOLANA v1.1</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const nameIn = document.getElementById('nameIn');
        const humanCheck = document.getElementById('humanCheck');
        const mintBtn = document.getElementById('mintBtn');
        const connectBtn = document.getElementById('connectBtn');
        const prevName = document.getElementById('prevName');
        const statusTxt = document.getElementById('statusTxt');
        
        let walletAddress = null;

        // Validation Function
        function validate() {
            const isNameValid = nameIn.value.trim().length > 0;
            const isHumanChecked = humanCheck.checked;
            
            if (walletAddress && isNameValid && isHumanChecked) {
                mintBtn.disabled = false;
                mintBtn.classList.remove('bg-gray-800', 'text-gray-500', 'cursor-not-allowed');
                mintBtn.classList.add('bg-[#14F195]', 'text-black', 'cursor-pointer', 'shadow-[0_0_25px_rgba(20,241,149,0.4)]');
                mintBtn.innerText = "Execute Personhood Mint";
            } else {
                mintBtn.disabled = true;
                mintBtn.classList.add('bg-gray-800', 'text-gray-500', 'cursor-not-allowed');
                mintBtn.classList.remove('bg-[#14F195]', 'text-black', 'shadow-[0_0_25px_rgba(20,241,149,0.4)]');
                mintBtn.innerText = "Mint Verified Passport";
            }
        }

        nameIn.addEventListener('input', (e) => {
            prevName.innerText = e.target.value || "---";
            validate();
        });

        humanCheck.addEventListener('change', validate);

        connectBtn.onclick = async () => {
            if (window.solana) {
                try {
                    const resp = await window.solana.connect();
                    walletAddress = resp.publicKey.toString();
                    connectBtn.innerHTML = `<i class="fa-solid fa-check-circle text-[#14F195]"></i> Connected`;
                    validate();
                } catch (err) { alert("Wallet Denied!"); }
            } else { alert("Install Phantom Wallet!"); }
        };

        mintBtn.onclick = () => {
            mintBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Finalizing On Chain...`;
            mintBtn.disabled = true;

            setTimeout(() => {
                alert("Protocol Success: Identity Proven on Solana Devnet.");
                statusTxt.innerText = "IDENTITY_PROVEN";
                statusTxt.classList.replace('text-yellow-500', 'text-[#14F195]');
                mintBtn.innerHTML = "Success ✅";
                mintBtn.style.background = "#9945FF";
                mintBtn.style.color = "white";
            }, 2500);
        };
    </script>
</body>
</html>
