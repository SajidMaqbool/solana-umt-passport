<div class="glass p-10 space-y-8 animate__animated animate__fadeInLeft">
    <div class="flex items-center gap-3 mb-2">
        <i class="fa-solid fa-pen-to-square text-[#14F195]"></i>
        <h3 class="text-2xl font-bold tracking-tight">Registration Office</h3>
    </div>
    
    <div class="space-y-6">
        <div>
            <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2 block">Student Name</label>
            <input type="text" id="nameIn" placeholder="Full Name" class="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 focus:border-[#14F195] outline-none text-white font-bold">
        </div>
        
        <div>
            <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2 block">UMT Roll Number</label>
            <input type="text" id="idIn" placeholder="F2021-000" class="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 focus:border-[#14F195] outline-none text-white font-bold">
        </div>

        <div class="bg-white/5 p-4 rounded-xl border border-white/10 flex items-center gap-4">
            <input type="checkbox" id="humanCheck" class="w-5 h-5 accent-[#14F195] cursor-pointer">
            <label for="humanCheck" class="text-sm font-bold text-gray-300 cursor-pointer select-none">
                I am not a bot. Verify my identity.
            </label>
        </div>

        <div class="flex gap-4 pt-4">
            <button id="mintBtn" disabled class="flex-1 bg-gray-700 text-gray-400 py-4 rounded-2xl font-black text-xs uppercase tracking-tighter cursor-not-allowed transition-all shadow-none">
                Mint Identity
            </button>
            <button class="flex-1 glass py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-white/5 border border-white/10">
                Update
            </button>
        </div>
    </div>
</div>

<script>
    // --- WALLET CONNECT LOGIC ---
    let userWallet = null;

    document.getElementById('connectBtn').addEventListener('click', async () => {
        if (window.solana) {
            try {
                const resp = await window.solana.connect();
                userWallet = resp.publicKey.toString();
                document.getElementById('connectBtn').innerHTML = `<i class="fa-solid fa-circle-check text-[#14F195]"></i> ${userWallet.slice(0,4)}...${userWallet.slice(-4)}`;
                checkReady(); // Check if ready to mint
            } catch (err) { alert("Connection Cancelled"); }
        } else { alert("Phantom Wallet install karein!"); }
    });

    // --- HUMAN VERIFICATION LOGIC ---
    const humanCheck = document.getElementById('humanCheck');
    const mintBtn = document.getElementById('mintBtn');

    humanCheck.addEventListener('change', function() {
        checkReady();
    });

    function checkReady() {
        // Agar Wallet connected hai AUR human verify ho gaya hai
        if (userWallet && humanCheck.checked) {
            mintBtn.disabled = false;
            mintBtn.classList.remove('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
            mintBtn.classList.add('bg-[#14F195]', 'text-black', 'shadow-[0_10px_30px_rgba(20,241,149,0.3)]');
            mintBtn.innerText = "Ready to Mint";
        } else {
            mintBtn.disabled = true;
            mintBtn.classList.add('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
            mintBtn.classList.remove('bg-[#14F195]', 'text-black', 'shadow-[0_10px_30px_rgba(20,241,149,0.3)]');
            mintBtn.innerText = "Mint Identity";
        }
    }

    mintBtn.addEventListener('click', () => {
        alert("Success! Human Verified & Wallet Connected.\nSending transaction to: CLEhaRz7...");
    });

    // --- Baki Preview Logic wahi rahegi ---
</script>
