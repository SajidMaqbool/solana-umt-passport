<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Passport - UMT Lahore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        .umt-gradient { background: linear-gradient(135deg, #004d26 0%, #007a3d 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <nav class="umt-gradient text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-1 rounded">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/4/44/University_of_Management_and_Technology_%28UMT%29_logo.png/220px-University_of_Management_and_Technology_%28UMT%29_logo.png" alt="UMT Logo" class="h-10">
                </div>
                <h1 class="text-xl font-bold uppercase tracking-wider">Solana Passport</h1>
            </div>
            <button id="connectBtn" class="bg-yellow-500 hover:bg-yellow-600 text-blue-900 font-bold py-2 px-6 rounded-full transition duration-300 shadow-md">
                Connect Wallet
            </button>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-4">
        <div class="max-w-2xl mx-auto">
            
            <div id="statusSection" class="hidden mb-6 p-4 rounded-lg bg-green-100 border border-green-400 text-green-700 flex items-center justify-between">
                <span>Wallet Connected: <b id="walletAddress">Not Connected</b></span>
                <span class="bg-green-500 text-white text-xs px-2 py-1 rounded-full uppercase">Verified Student</span>
            </div>

            <div class="glass-card rounded-2xl shadow-xl p-8 mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Student Identity Details</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="studentName" placeholder="Enter your name" class="mt-1 block w-full px-4 py-3 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">UMT Student ID</label>
                        <input type="text" id="umtId" placeholder="e.g. F2020-123" class="mt-1 block w-full px-4 py-3 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 pt-4">
                        <button onclick="handlePassport('create')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">Create Passport</button>
                        <button onclick="handlePassport('update')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">Update Info</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-md p-8 border border-red-100">
                <h3 class="text-lg font-bold text-red-600 mb-2">Danger Zone</h3>
                <p class="text-gray-500 text-sm mb-4">Deleting your passport will remove your data from the Solana blockchain.</p>
                <button onclick="handlePassport('delete')" class="text-red-600 border border-red-600 hover:bg-red-50 py-2 px-4 rounded-lg text-sm font-semibold transition">
                    Delete My Passport
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center mt-20 text-gray-500 text-sm pb-10">
        Built for UMT Blockchain Course • Powered by Solana & Anchor
    </footer>

    <script>
        // Frontend Logic (Hum yahan wallet connect aur commands handle karenge)
        let walletAddress = null;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (window.solana && window.solana.isPhantom) {
                try {
                    const response = await window.solana.connect();
                    walletAddress = response.publicKey.toString();
                    document.getElementById('walletAddress').innerText = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
                    document.getElementById('statusSection').classList.remove('hidden');
                    document.getElementById('connectBtn').innerText = "Connected";
                } catch (err) {
                    alert("Connection failed!");
                }
            } else {
                alert("Please install Phantom Wallet!");
            }
        });

        function handlePassport(action) {
            if (!walletAddress) return alert("Pehle Wallet connect karein!");
            
            const name = document.getElementById('studentName').value;
            const id = document.getElementById('umtId').value;

            if (action === 'create' || action === 'update') {
                alert(`${action.toUpperCase()} Action Triggered for ${name} (${id}).\nConnecting to Solana Program...`);
                // Backend integration logic yahan aayegi
            } else if (action === 'delete') {
                alert("Deleting Passport from Blockchain...");
            }
        }
    </script>
</body>
</html>
